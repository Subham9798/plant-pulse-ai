<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; width: 350px; }
        h1 { margin-bottom: 20px; color: #10b981; }
        input { margin: 15px 0; color: white; }
        button { background: #10b981; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #059669; }
        #result { margin-top: 20px; font-size: 1.2em; font-weight: bold; color: #f8fafc; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Plant Pulse AI</h1>
        <input type="file" id="fileInput">
        <button onclick="uploadImage()">Analyze & Cure</button>
        <div id="result">Disease: Waiting...</div>
    </div>

    <script>
        async function uploadImage() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return alert("Select an image first!");
            document.getElementById('result').innerText = "Analyzing...";
            const formData = new FormData();
            formData.append('file', file);
            const response = await fetch('/predict', { method: 'POST', body: formData });
            const data = await response.json();
            document.getElementById('result').innerText = "Disease: " + data.prediction;
        }
    </script>
</body>
</html>
