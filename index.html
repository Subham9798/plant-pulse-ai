<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantPulse AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0fdf4; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: white; padding: 15px 50px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .hero { padding: 80px 50px; display: flex; align-items: center; justify-content: space-between; }
        .btn-green { background-color: #10b981; color: white; border-radius: 20px; padding: 10px 25px; }
        .card { padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <a class="navbar-brand fw-bold text-success" href="#">PlantPulse AI</a>
        <div class="ms-auto">
            <a class="nav-link d-inline mx-3" href="#">Home</a>
            <a class="nav-link d-inline mx-3" href="#">Features</a>
            <a class="nav-link d-inline mx-3" href="#">Contact</a>
        </div>
    </nav>

    <div class="hero">
        <div>
            <h1>Protect Your Crops with<br><span class="text-success">AI-Powered Detection</span></h1>
            <p>Upload a leaf image to get instant analysis and treatment.</p>
        </div>
        
        <div class="card" style="width: 350px;">
            <input type="file" id="fileInput" class="form-control mb-3">
            <button class="btn btn-green w-100" onclick="uploadImage()">Start Detection</button>
            <h4 id="result" class="mt-3 text-center">Disease: Waiting...</h4>
        </div>
    </div>

    <script>
        async function uploadImage() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return alert("Select an image first!");
            document.getElementById('result').innerText = "Analyzing...";
            const formData = new FormData();
            formData.append('file', file);
            const response = await fetch('/predict', { method: 'POST', body: formData });
            const data = await response.json();
            document.getElementById('result').innerText = "Disease: " + data.prediction;
        }
    </script>
</body>
</html>
